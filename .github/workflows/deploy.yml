name: Deploy to xneelo

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies & build Astro site
      run: |
        npm ci
        npm run build
        test -d dist

    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: Deploy build output via LFTP
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_USER: ${{ secrets.FTP_USER }}
        FTP_PASS: ${{ secrets.FTP_PASS }}
      run: |
        if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
          echo "::error::Missing required FTP secrets. Ensure FTP_HOST, FTP_USER and FTP_PASS are set in the repository secrets."
          exit 1
        fi

        lftp -c "
        set ftp:ssl-allow no;
        set ftp:passive-mode true;
        set net:max-retries 2;
        set net:timeout 10;
        set net:reconnect-interval-base 2;
        open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_HOST\";
        mirror --reverse --delete --continue --parallel=2 --verbose ./dist /public_html/ChurchWebsite/ --exclude-glob .ht*
        "
