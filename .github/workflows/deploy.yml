name: Deploy to xneelo

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Install lftp
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: Deploy via LFTP
      run: |
        lftp -c "
        set ftp:ssl-allow no;
        set ftp:passive-mode true;
        set net:max-retries 3;
        set net:timeout 10;
        set net:reconnect-interval-base 2;
        open -u entzaerzxg,1JdTs6D9422745 196.40.97.146;
        mirror --reverse --delete --parallel=3 --verbose . /public_html/ChurchWebsite/ --exclude-glob .git* --exclude-glob .github/ --exclude-glob .ht*
        "
